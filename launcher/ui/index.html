<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetcher Simulator Launcher</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      --bg: #0a0d12;
      --panel: rgba(21, 26, 36, 0.92);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f7fb;
      --muted: #9ea8b8;
      --accent: #e79b38;
      --accent-strong: #ffb44f;
      --success: #49d18b;
      --danger: #ff6b6b;
      --shadow: 0 22px 55px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 14% 5%, rgba(231, 155, 56, 0.15), transparent 30rem),
        radial-gradient(circle at 88% 15%, rgba(81, 112, 173, 0.14), transparent 34rem),
        var(--bg);
      color: var(--text);
    }

    body {
      min-width: 0;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 1120px;
      min-width: 0;
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 22px;
    }

    .brand,
    .hero,
    .card,
    .actions,
    .status-grid,
    .lower,
    #log {
      min-width: 0;
      max-width: 100%;
    }

    .topbar {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, #ffbd62, #bd6e17);
      box-shadow: 0 14px 34px rgba(231, 155, 56, 0.28);
      color: #171008;
      font-size: 27px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .channel-pill {
      border: 1px solid rgba(231, 155, 56, 0.35);
      background: rgba(231, 155, 56, 0.11);
      color: #ffd49a;
      border-radius: 999px;
      padding: 8px 13px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
      gap: 18px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .actions {
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .actions h2 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .actions p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 16px;
      color: var(--text);
      background: #252c39;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.2);
      background: #2c3545;
    }

    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .primary {
      min-width: 170px;
      color: #1a1208;
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent-strong), var(--accent));
      box-shadow: 0 12px 28px rgba(231, 155, 56, 0.22);
    }

    .primary:hover:not(:disabled) {
      border-color: transparent;
      background: linear-gradient(135deg, #ffc574, #eea240);
    }

    .play {
      border-color: rgba(73, 209, 139, 0.32);
      background: rgba(73, 209, 139, 0.12);
      color: #91f2bf;
    }

    .status-grid {
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status-item {
      min-height: 86px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.065);
      background: rgba(255, 255, 255, 0.025);
    }

    .status-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .status-value {
      margin-top: 8px;
      font-weight: 750;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .lower {
      min-height: 300px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .log-header {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .log-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 750;
    }

    .indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #697485;
      box-shadow: 0 0 0 4px rgba(105, 116, 133, 0.12);
    }

    .indicator.running {
      background: var(--accent-strong);
      box-shadow: 0 0 0 4px rgba(231, 155, 56, 0.15);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .indicator.success {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(73, 209, 139, 0.14);
    }

    .indicator.failed {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.14);
    }

    @keyframes pulse {
      50% { opacity: 0.48; transform: scale(0.82); }
    }

    .small-button {
      padding: 7px 10px;
      font-size: 12px;
      background: transparent;
    }

    #log {
      margin: 0;
      padding: 18px;
      overflow: auto;
      min-height: 250px;
      max-height: 48vh;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #d4d9e2;
      background: rgba(3, 5, 8, 0.42);
      font: 12.5px/1.58 "Cascadia Mono", Consolas, monospace;
    }

    .notice {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 18px);
      max-width: min(620px, calc(100vw - 40px));
      padding: 11px 15px;
      border: 1px solid rgba(255, 107, 107, 0.32);
      border-radius: 12px;
      background: #351c22;
      color: #ffd1d1;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .notice.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 820px) {
      .app { padding: 22px; }
      .hero { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; }
      .channel-pill { margin-top: 5px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">F</div>
        <div>
          <h1>Fetcher Simulator</h1>
          <div class="subtitle">Windows public-test launcher</div>
        </div>
      </div>
      <div id="channelPill" class="channel-pill">Loading</div>
    </header>

    <section class="hero">
      <article class="card actions">
        <div>
          <h2 id="headline">Checking installation…</h2>
          <p id="summary">The launcher uses the existing Fetcher PowerShell updater and keeps its tested update behavior intact.</p>
        </div>
        <div class="button-row">
          <button id="updateButton" class="primary">Run Update</button>
          <button id="playButton" class="play">Play</button>
          <button id="wizardButton">Setup Wizard</button>
          <button id="folderButton">Open Folder</button>
        </div>
      </article>

      <aside class="card status-grid">
        <div class="status-item">
          <div class="status-label">Channel</div>
          <div id="channelValue" class="status-value">—</div>
        </div>
        <div class="status-item">
          <div class="status-label">Release</div>
          <div id="releaseValue" class="status-value">—</div>
        </div>
        <div class="status-item">
          <div class="status-label">Installed commit</div>
          <div id="commitValue" class="status-value">—</div>
        </div>
        <div class="status-item">
          <div class="status-label">Installation</div>
          <div id="installValue" class="status-value">—</div>
        </div>
      </aside>
    </section>

    <section class="card lower">
      <div class="log-header">
        <div class="log-title">
          <span id="indicator" class="indicator"></span>
          <span id="logStatus">Ready</span>
        </div>
        <button id="clearButton" class="small-button">Clear log</button>
      </div>
      <pre id="log">Fetcher Launcher ready.\n</pre>
    </section>
  </main>

  <div id="notice" class="notice"></div>

  <script type="module">
    const ui = Object.fromEntries([
      "channelPill", "headline", "summary", "updateButton", "playButton",
      "wizardButton", "folderButton", "channelValue", "releaseValue",
      "commitValue", "installValue", "indicator", "logStatus", "log",
      "clearButton", "notice"
    ].map(id => [id, document.getElementById(id)]));

    let currentStatus = null;
    let updateRunning = false;
    let noticeTimer = null;

    function shortCommit(commit) {
      return commit ? commit.slice(0, 10) : "Not installed";
    }

    function showNotice(message) {
      if (!message) return;
      ui.notice.textContent = message;
      ui.notice.classList.add("visible");
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => ui.notice.classList.remove("visible"), 5200);
    }

    function appendLog(text) {
      if (!text) return;
      ui.log.textContent += text.replace(/\r(?!\n)/g, "\n");
      ui.log.scrollTop = ui.log.scrollHeight;
    }

    function setIndicator(state, label) {
      ui.indicator.className = `indicator ${state || ""}`.trim();
      ui.logStatus.textContent = label;
    }

    function applyStatus(status) {
      currentStatus = status;
      updateRunning = Boolean(status.busy);
      const channel = status.channel || "default";
      ui.channelPill.textContent = channel;
      ui.channelValue.textContent = channel;
      ui.releaseValue.textContent = status.releaseTag || "Unknown";
      ui.commitValue.textContent = shortCommit(status.commit);
      ui.installValue.textContent = status.installRoot || "Unknown";

      const ready = status.updaterAvailable && status.openmwAvailable;
      ui.headline.textContent = updateRunning
        ? "Updating Fetcher Simulator"
        : ready ? "Ready for the public test" : "Installation needs attention";
      ui.summary.textContent = !status.updaterAvailable
        ? "Update-Fetcher-Simulator.ps1 is missing from this folder."
        : !status.openmwAvailable
          ? "Run the updater or setup wizard to finish installing OpenMW."
          : "Run the updater before joining, then launch OpenMW from this window.";

      ui.updateButton.disabled = updateRunning || !status.updaterAvailable;
      ui.updateButton.textContent = updateRunning ? "Updating…" : "Run Update";
      ui.playButton.disabled = updateRunning || !status.openmwAvailable;
      ui.wizardButton.disabled = updateRunning || !status.wizardAvailable;
      ui.folderButton.disabled = updateRunning;
      if (updateRunning) setIndicator("running", "Updater running");
    }

    async function refreshStatus() {
      try {
        applyStatus(await window.fetcherGetStatus());
      } catch (error) {
        showNotice(`Could not read installation status: ${error}`);
      }
    }

    async function runAction(action, fallbackMessage) {
      try {
        const result = await action();
        if (result && result.ok === false) showNotice(result.error || fallbackMessage);
      } catch (error) {
        showNotice(`${fallbackMessage}: ${error}`);
      }
    }

    ui.updateButton.addEventListener("click", async () => {
      try {
        const result = await window.fetcherStartUpdate();
        if (!result.started) {
          showNotice(result.error || "The updater could not start.");
          return;
        }
        updateRunning = true;
        applyStatus({ ...currentStatus, busy: true });
      } catch (error) {
        showNotice(`The updater could not start: ${error}`);
      }
    });

    ui.playButton.addEventListener("click", () =>
      runAction(() => window.fetcherLaunchOpenMw(), "OpenMW could not be launched"));
    ui.wizardButton.addEventListener("click", () =>
      runAction(() => window.fetcherLaunchWizard(), "The setup wizard could not be launched"));
    ui.folderButton.addEventListener("click", () =>
      runAction(() => window.fetcherOpenInstallFolder(), "The installation folder could not be opened"));
    ui.clearButton.addEventListener("click", () => { ui.log.textContent = ""; });

    window.fetcherReceive = event => {
      if (!event || !event.type) return;
      if (event.type === "log") {
        appendLog(event.text);
      } else if (event.type === "update-started") {
        updateRunning = true;
        setIndicator("running", "Updater running");
      } else if (event.type === "update-complete") {
        updateRunning = false;
        if (event.status) applyStatus(event.status);
        if (event.success) {
          appendLog("\nUpdate completed successfully.\n");
          setIndicator("success", "Update complete");
        } else {
          appendLog(`\nUpdate failed with exit code ${event.exitCode}.\n`);
          setIndicator("failed", "Update failed");
          showNotice(event.error || `Updater exited with code ${event.exitCode}.`);
        }
      }
    };

    let resizeFrame = 0;
    function resetHorizontalViewport() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        document.documentElement.scrollLeft = 0;
        document.body.scrollLeft = 0;
        window.scrollTo(0, window.scrollY);
      });
    }

    window.addEventListener("resize", resetHorizontalViewport, { passive: true });
    window.visualViewport?.addEventListener("resize", resetHorizontalViewport, { passive: true });
    resetHorizontalViewport();

    await refreshStatus();
  </script>
</body>
</html>
