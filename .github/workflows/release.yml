name: Fetcher updater stable prerelease

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: fetcher-tester-tools-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Build Windows Fetcher Launcher
        shell: pwsh
        run: |
          .\scripts\Build-FetcherLauncher.ps1 -Clean

      - name: Build digest-backed tester tools package
        shell: pwsh
        run: |
          .\scripts\Build-FetcherTesterTools.ps1 `
            -OutputDir "${{ github.workspace }}\release-assets" `
            -LauncherDir "${{ github.workspace }}\release-assets\fetcher-launcher" `
            -SourceCommit "${{ github.sha }}"

      - name: Validate tester tools package and installer
        shell: pwsh
        run: |
          .\tests\Test-Package.ps1 `
            -ArchivePath "${{ github.workspace }}\release-assets\fetcher-tester-tools.zip"
          .\tests\Test-OptionalLauncherQuarantine.ps1 `
            -ArchivePath "${{ github.workspace }}\release-assets\fetcher-tester-tools.zip"
          .\tests\Test-ClientInventory.ps1
          .\tests\Test-Integration.ps1 `
            -ArchivePath "${{ github.workspace }}\release-assets\fetcher-tester-tools.zip"

      - name: Replace stable tester tools prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\Publish-StableGitHubRelease.ps1 `
            -Repository "${{ github.repository }}" `
            -Tag "fetcher-tester-tools" `
            -TargetCommit "${{ github.sha }}" `
            -Title "Fetcher Simulator Updater and Tester Tools" `
            -Notes "For a new installation, download FetcherSetup.exe. The native launcher provides a server browser and mod profiles. Existing installations can use their normal updater, then close and reopen Fetcher Launcher. Setup-Fetcher-Updater.bat remains available as the legacy bootstrap. Studio server/content rollout is separate." `
            -Assets @(
              "${{ github.workspace }}\release-assets\fetcher-tester-tools.zip"
              "${{ github.workspace }}\release-assets\FetcherSetup.exe"
              "${{ github.workspace }}\release-assets\Install-Fetcher-Tester-Tools.ps1"
              "${{ github.workspace }}\release-assets\Setup-Fetcher-Updater.bat"
              "${{ github.workspace }}\release-assets\fetcher-simulator-umo.json"
            )
